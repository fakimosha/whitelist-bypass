name: Build Softfloat MIPSLE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Build MIPSLE Softfloat Binaries
        run: |
          ROOT_DIR=$(pwd)
          mkdir -p "$ROOT_DIR/build"
          
          cd "$ROOT_DIR/headless"
          
          for dir in */; do
            if [ -f "${dir}go.mod" ]; then
              APP_NAME=$(basename "$dir")
              BIN_NAME="headless-${APP_NAME}"
              if [ "$APP_NAME" = "vk-bot" ]; then BIN_NAME="headless-vk-bot"; fi
              if [ "$APP_NAME" = "telemost" ]; then BIN_NAME="headless-telemost-creator"; fi
              if [ "$APP_NAME" = "telemost-joiner" ]; then BIN_NAME="headless-telemost-joiner"; fi
              if [ "$APP_NAME" = "vk" ]; then BIN_NAME="headless-vk-creator"; fi
              if [ "$APP_NAME" = "wbstream" ]; then BIN_NAME="headless-wbstream-creator"; fi
              if [ "$APP_NAME" = "wbstream-joiner" ]; then BIN_NAME="headless-wbstream-joiner"; fi
              if [ "$APP_NAME" = "dion" ]; then BIN_NAME="headless-dion-creator"; fi
              if [ "$APP_NAME" = "dion-joiner" ]; then BIN_NAME="headless-dion-joiner"; fi

              echo "Compiling $APP_NAME -> $BIN_NAME..."
              (cd "$dir" && GOTOOLCHAIN=local GOOS=linux GOARCH=mipsle GOMIPS=softfloat GODEBUG=asyncpreemptoff=1 go build -ldflags="-s -w" -o "$ROOT_DIR/build/$BIN_NAME" .)
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlb-keenetic-softfloat
          path: build/*
