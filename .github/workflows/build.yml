name: Build Softfloat MIPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build MIPSLE Softfloat Binaries
        run: |
          mkdir -p build
          # Переходим в папку, где лежит go.mod
          cd headless || cd vps || cd .
          
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o ../build/headless-vk-bot ./cmd/headless-vk-bot || GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o ./build/headless-vk-bot ./cmd/headless-vk-bot

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlb-keenetic-softfloat
          path: build/*
