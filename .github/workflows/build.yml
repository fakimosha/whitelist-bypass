name: Build Softfloat MIPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build MIPSLE Softfloat Binaries
        run: |
          ROOT_DIR=$(pwd)
          mkdir -p "$ROOT_DIR/build"
          
          # Находим все директории с go.mod и собираем бинарники в них
          find . -name "go.mod" -not -path "*/.*" | while read -r gomod; do
            DIR=$(dirname "$gomod")
            echo "=== Building in $DIR ==="
            cd "$ROOT_DIR/$DIR"
            
            # Проверяем наличие cmd/ и собираем все подкоманды
            if [ -d "cmd" ]; then
              for cmd in cmd/*; do
                if [ -d "$cmd" ]; then
                  BIN_NAME=$(basename "$cmd")
                  echo "Building $BIN_NAME..."
                  GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o "$ROOT_DIR/build/$BIN_NAME" "./$cmd" || true
                fi
              done
            fi
          done

      - name: Check output
        run: |
          echo "Built binaries:"
          ls -la build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlb-keenetic-softfloat
          path: build/*
